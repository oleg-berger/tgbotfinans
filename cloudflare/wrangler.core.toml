name = "tgbotfinans-core"
main = "src/worker.py"
compatibility_date = "2026-08-01"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[durable_objects]
bindings = [{ name = "FINANCE", class_name = "FinanceStore" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FinanceStore"]

[assets]
directory = "assets"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false
